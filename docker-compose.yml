services:
  eiffelpulse:
    build: .
    container_name: eiffelpulse
    restart: unless-stopped
    ports:
      - "5050:5050"
    environment:
      - PORT=5050
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5050/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
